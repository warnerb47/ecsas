<div class="flex flex-col items-center justify-center">
  <span class="block text-xs font-medium text-slate-500 mb-2">{{ label() }}</span>
  <p-toggleswitch [invalid]="invalid() && touched()" [disabled]="disabled()" (onChange)="setValue($event.checked)" />
  <!-- Internal Error Display -->
  @if (invalid() && touched()) {
    <div class="text-red-500 text-xs mt-1">
      @for (error of errors(); track error.kind) {
        <span>{{ error.message }}</span>
      }
    </div>
  }
</div>
