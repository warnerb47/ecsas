
<div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="px-8 py-5 bg-slate-50/50 border-b border-slate-100 flex items-center justify-between">
        <h3 class="text-lg font-bold text-slate-500">Maintenance des données</h3>
    </div>
    <div class="p-8">
        <div class="grid gap-y-6">
            <div class="flex-1">
                <h4 class="text-lg font-bold text-slate-800 mb-2">Exporter ou Importer une sauvegarde ZIP</h4>
                <p class="text-sm text-slate-500 leading-relaxed mb-4">
                    Exporter ou Importer une archive complète de votre base de données locale (**SQLite**) et des fichiers numérisés. Ce fichier pourra être utilisé pour restaurer le système sur une autre machine.
                </p>
            </div>
            <div class="pt-4 flex justify-end space-x-4 border-t border-slate-50">
                <lib-button (click)="restoreBackup()" type="secondary">Importer</lib-button>
                <lib-button (click)="createBackup()" type="primary">Exporter</lib-button>
            </div>
        </div>
    </div>
</div>
