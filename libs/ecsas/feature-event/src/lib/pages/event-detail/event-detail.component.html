<div class="flex-1 flex flex-col overflow-hidden">
  <lib-topbar [breadcrumbItems]="breadcrumbItems" searchPlaceholder="Rechercher un événement..."></lib-topbar>

  <div class="flex-1 overflow-y-auto p-8">
    <div class="max-w-6xl mx-auto">
      @if (event(); as current) {

        <lib-event-header
          [event]="current"
          (edit)="onEdit()"></lib-event-header>

        <lib-event-info
          [expenses]="expenses()"
          [partners]="partners()"
          [links]="usefulLinks()"
          [documents]="current.documents ?? []"
          [budget]="current.budget"
          [totalSpent]="totalSpent()"
          [remaining]="remaining()"
          [executionRate]="executionRate()"
          (addExpense)="onAddExpense()"
          (editExpense)="onEditExpense($event)"
          (deleteExpense)="onDeleteExpense($event)"
          (addLink)="onAddLink()"
          (deleteLink)="onDeleteLink($event)"
          (addPartner)="onAddPartner()"
          (deletePartner)="onDeletePartner($event)"
          (generateDocument)="onGenerateDocument($event)"
          (uploadDocument)="onUploadDocument($event)"
          (visualizeDocument)="onVisualizeDocument($event)"
          (openFolder)="openFolder()"></lib-event-info>
      } @else {
        <div class="flex items-center justify-center py-24 text-slate-400">
          <i class="pi pi-spin pi-spinner mr-2"></i> Chargement...
        </div>
      }
    </div>
  </div>
</div>
