<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
  <div class="flex items-center justify-between px-6 py-4 bg-slate-50 border-b border-slate-100">
    <div class="flex items-center gap-3">
      <h3 class="text-sm font-black text-[#1A365D] uppercase tracking-wider">
        <i class="pi pi-folder mr-2"></i>
        Documents
      </h3>
    </div>
    <lib-button type="secondary" (click)="openFolder.emit()">
      <i class="pi pi-folder mr-2"></i>
      Ouvrir le dossier
    </lib-button>
  </div>

  <div class="px-6 py-6">
    <div class="grid md:grid-cols-2 gap-4">
      @for (def of documentDefs; track def.type) {
        <lib-event-document-card
          [def]="def"
          [doc]="getDocument(def)"
          (upload)="upload.emit($event)"
          (visualize)="visualize.emit($event)"></lib-event-document-card>
      }
    </div>
  </div>
</div>
