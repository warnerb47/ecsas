@if (doc()) {
  <div class="border border-slate-100 rounded-xl p-5 flex flex-col">
    <div class="flex items-start justify-between mb-3">
      <div class="w-11 h-11 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center">
        <i [class]="def().icon"></i>
      </div>
      <span class="px-3 py-1 rounded-full text-[11px] font-bold border"
        [class]="doc()?.status === 'GENERATED'
          ? 'bg-emerald-50 text-emerald-700 border-emerald-100'
          : 'bg-blue-50 text-blue-700 border-blue-100'">
        {{ doc()?.status === 'GENERATED' ? 'Généré' : 'Téléversé' }}
      </span>
    </div>
    <p class="font-bold text-slate-700">{{ def().label }}</p>
    <p class="text-xs text-slate-400 mt-1">{{ def().description }}</p>
    <div class="flex items-center gap-2 mt-3 text-xs text-slate-500 bg-slate-50 rounded-lg px-3 py-2">
      <i class="pi pi-file"></i>
      <span class="truncate">{{ doc()?.fileName || (def().label + '.pdf') }}</span>
    </div>
    <div class="flex items-center gap-2 justify-end mt-4 pt-4 border-t border-slate-100">
      <lib-button type="secondary">
        <i class="pi pi-eye mr-1 text-xs"></i> Consulter
      </lib-button>
      <lib-button type="secondary" (click)="onGenerate()">
        <i class="pi pi-refresh mr-1 text-xs"></i> Régénérer
      </lib-button>
      <input #uploadInput type="file" class="hidden" (change)="onFileChange($event)" />
      <lib-button type="secondary" (click)="uploadInput.click()">
        <i class="pi pi-upload mr-1 text-xs"></i> Remplacer
      </lib-button>
    </div>
  </div>
} @else {
  <div class="border border-dashed border-slate-200 rounded-xl p-5 flex flex-col bg-slate-50/50">
    <div class="flex items-start justify-between mb-3">
      <div class="w-11 h-11 rounded-xl bg-slate-100 text-slate-500 flex items-center justify-center">
        <i [class]="def().icon"></i>
      </div>
      <span class="px-3 py-1 rounded-full text-[11px] font-bold border bg-slate-50 text-slate-500 border-slate-100">
        Manquant
      </span>
    </div>
    <p class="font-bold text-slate-700">{{ def().label }}</p>
    <p class="text-xs text-slate-400 mt-1">{{ def().description }}</p>
    <div class="flex items-center justify-end gap-2 mt-6 pt-4 border-t border-slate-100">
      <lib-button type="secondary" (click)="onGenerate()">
        <i class="pi pi-file-pdf mr-1 text-xs"></i> Générer
      </lib-button>
      <input #uploadInput type="file" class="hidden" (change)="onFileChange($event)" />
      <lib-button type="secondary" (click)="uploadInput.click()">
        <i class="pi pi-upload mr-1 text-xs"></i> Charger
      </lib-button>
    </div>
  </div>
}
