<!-- Partenaires -->
<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
  <div class="flex items-center justify-between px-6 py-4 bg-slate-50 border-b border-slate-100">
    <div class="flex items-center gap-3">
      <h3 class="text-sm font-black text-[#1A365D] uppercase tracking-wider">
        <i class="pi pi-users mr-2"></i> Partenaires
      </h3>
    </div>
    <button type="button" class="w-8 h-8 flex items-center justify-center rounded-full text-white bg-[#1A365D] hover:bg-blue-800"
      (click)="addPartner.emit()">
      <i class="pi pi-plus" style="font-size: 0.7rem"></i>
    </button>
  </div>
  <div class="px-6 py-5">
    @if (partners().length) {
      <ul class="space-y-3">
        @for (partner of partners(); track partner.id) {
          <li class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-10 h-10 rounded-full flex items-center justify-center text-xs font-black shrink-0"
                [style.background]="partner.color ?? '#E2E8F0'" [style.color]="'#475569'">
                {{ (partner.name || '?').charAt(0).toUpperCase() }}
              </div>
              <div class="min-w-0">
                <p class="font-bold text-slate-700 text-sm truncate">{{ partner.name }}</p>
                <span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-blue-50 text-blue-700 inline-block">
                  {{ partner.role || 'Partenaire' }}
                </span>
              </div>
            </div>
            <button type="button" class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50 transition shrink-0" (click)="deletePartner.emit(partner)">
              <i class="pi pi-trash text-xs"></i>
            </button>
          </li>
        }
      </ul>
    } @else {
      <p class="text-sm text-slate-400 text-center">Aucun partenaire ajouté.</p>
    }
  </div>
</div>
