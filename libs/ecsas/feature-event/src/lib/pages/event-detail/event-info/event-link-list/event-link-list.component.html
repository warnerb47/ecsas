<!-- Liens utiles -->
<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
  <div class="flex items-center justify-between px-6 py-4 bg-slate-50 border-b border-slate-100">
    <div class="flex items-center gap-3">
      <i class="pi pi-bookmark"></i>
      <h3 class="text-base font-bold text-slate-700 uppercase tracking-wide">Liens utiles</h3>
    </div>
    <lib-button type="secondary" (click)="addLink.emit()">
      <i class="pi pi-plus mr-2"></i>
      Ajouter
    </lib-button>
  </div>
  <div class="px-6 py-5">
    @if (links().length) {
      <ul class="space-y-3">
        @for (link of links(); track link.id) {
          <li class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center shrink-0">
                <i class="pi pi-link text-sm"></i>
              </div>
              <div class="min-w-0">
                <p class="font-bold text-slate-700 text-sm truncate">{{ link.label }}</p>
                <p class="text-xs text-slate-400 truncate">{{ link.url }}</p>
              </div>
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <a [href]="link.url" target="_blank" rel="noopener"
                class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-blue-600 hover:bg-blue-50 transition">
                <i class="pi pi-external-link text-xs"></i>
              </a>
              <button type="button" class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50 transition" (click)="deleteLink.emit(link)">
                <i class="pi pi-trash text-xs"></i>
              </button>
            </div>
          </li>
        }
      </ul>
    } @else {
      <p class="text-sm text-slate-400">Aucun lien utile ajouté.</p>
    }
  </div>
</div>
