<div class="bg-white rounded-3xl border border-slate-200 shadow-sm transition flex flex-col justify-between overflow-hidden">
    <div class="p-6 space-y-4">
        <!-- Header Carte -->
        <div class="flex justify-between items-start">
            <div>
              <span class="flex items-center px-2 py-1 bg-amber-50 border border-amber-200 text-amber-700 rounded-full text-[10px] font-bold w-fit">
                  Scan en cours
              </span>
                <h3 class="text-sm font-bold text-slate-800 mt-2">
                  Demandeur : <span class="font-normal italic">En cours d'extraction...</span>
                </h3>
            </div>
        </div>

        <!-- Barre de Progression Globale -->
        <div>
            <div class="flex justify-between text-[10px] font-bold text-slate-500 mb-1">
                <span>Progression globale</span>
                <span>2 / 3 documents</span>
            </div>
            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                <div class="bg-blue-600 h-full w-2/3 animate-pulse rounded-full"></div>
            </div>
        </div>

        <!-- Statut des documents joints -->
        <div class="space-y-2 pt-2 border-t border-slate-100">
            <div class="flex items-center justify-between text-xs">
                <span class="text-slate-600 flex items-center space-x-2 truncate">
                    <i class="text-emerald-500 font-bold pi pi-check" style="font-size: 0.80rem"></i>
                    <span class="truncate">CNI_Moussa_Sall.pdf</span>
                </span>
                <span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">Scanné</span>
            </div>
            <div class="flex items-center justify-between text-xs">
                <span class="text-slate-600 flex items-center space-x-2 truncate">
                    <svg class="w-4 h-4 text-blue-500 animate-spin shrink-0" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span class="truncate">Demande_Maire.jpg</span>
                </span>
                <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">Analyse</span>
            </div>
            <div class="flex items-center justify-between text-xs opacity-50">
                <span class="text-slate-600 flex items-center space-x-2 truncate">
                    <i class="text-slate-400 pi pi-clock" style="font-size: 0.80rem"></i>
                    <span class="truncate">Certificat_Residence.pdf</span>
                </span>
                <span class="text-[10px] font-bold  bg-slate-100 px-2 py-0.5 rounded">En attente</span>
            </div>
        </div>
    </div>

    <!-- Footer Action -->
    <div class="p-4 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
        <span class="text-[10px] font-medium text-slate-400">
          Soumis le 20 janv 2026
        </span>
        <lib-button routerLink="/procedure/detail/{{procedureId()}}/application-scan-list/applicationScanId" type="primary">
          Voir détail
        </lib-button>
    </div>
</div>
