@if(!selectedFileName()) {
<div class="border-2 border-dashed border-slate-200 bg-slate-50 hover:border-slate-400 rounded-2xl p-4 flex flex-col items-center justify-center text-center cursor-pointer transition"
  role="button" tabindex="0"
  (click)="onUpload()" (keydown.enter)="onUpload()">
  <svg class="w-8 h-8 text-slate-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
  <span class="text-xs font-bold text-slate-600">{{document()?.name}}</span>
  <span class="text-[10px] text-slate-400 mt-1">Glissez ou cliquez pour charger</span>
</div>

  <input
    #fileInput type="file" class="hidden" (change)="onFileSelected($event)"
  />
} @else {
  @if (this.progressEvent()?.progress === 100) {
    <div class="border-2 border-dashed border-emerald-300 bg-emerald-50/30 rounded-2xl p-4 relative group hover:border-emerald-500 transition">
        <div class="flex justify-between items-start mb-3">
            <span class="text-[10px] font-black uppercase text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-md">CNI / Extrait</span>
            <span class="text-xs text-emerald-600 font-bold flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Chargé
            </span>
        </div>
        <p class="text-xs font-bold text-slate-700 truncate mb-1">CNI_Moussa_Sall.pdf</p>
        <p class="text-[10px] text-slate-400">Taille: 1.2 MB • Scanné à 100%</p>
    </div>
  }@else {
    <div class="border-2 border-dashed border-blue-300 bg-blue-50/30 rounded-2xl p-4 relative group hover:border-blue-500 transition">
      <div class="flex justify-between items-start mb-3">
          <span class="text-[10px] font-black uppercase text-blue-700 bg-blue-100 px-2 py-0.5 rounded-md">Demande Manuscrite</span>
          <span class="text-xs text-blue-600 font-bold flex items-center gap-1">
              <svg class="w-3 h-3 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
              Analyse
          </span>
      </div>
      <p class="text-xs font-bold text-slate-700 truncate mb-1">Demande_Maire.jpg</p>
      <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden mt-2">
          <!-- <div class="bg-blue-600 h-full w-2/3"></div> -->
            <div  class="bg-blue-600 h-full transition-all duration-300 ease-out"
              [style.width.%]="this.progressEvent()?.progress || 0">
            </div>
      </div>
    </div>
  }
}
