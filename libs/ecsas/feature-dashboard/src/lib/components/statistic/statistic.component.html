<div class="grid grid-cols-4 gap-6 mb-10">
  @if (loading()) {
    @for (i of [1, 2, 3, 4]; track i) {
      <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
        <div class="h-2.5 w-20 bg-slate-200 rounded mb-4 animate-pulse"></div>
        <div class="h-8 w-16 bg-slate-200 rounded animate-pulse mb-3"></div>
        <div class="h-2.5 w-24 bg-slate-200 rounded animate-pulse"></div>
      </div>
    }
  } @else if (error()) {
    <div class="col-span-4 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex items-center justify-between">
      <div class="flex items-center">
        <i class="pi pi-exclamation-triangle text-red-500 mr-3"></i>
        <p class="text-sm text-slate-500">Impossible de charger les statistiques.</p>
      </div>
      <lib-button type="primary" (click)="fetchStatistics()">
        <i class="pi pi-refresh"></i>
        Réessayer
      </lib-button>
    </div>
  } @else {
    <lib-statistic-card
        title="Total Demandes"
        [value]="total().toLocaleString('fr-FR')"
        valueColor="text-slate-800"
        description="Toutes les demandes"
        descriptionColor="text-slate-400">
    </lib-statistic-card>

    <lib-statistic-card
        title="En Traitement"
        [value]="pending().toLocaleString('fr-FR')"
        valueColor="text-blue-600"
        [description]="pendingPercentage() + ' du volume total'"
        descriptionColor="text-slate-400">
    </lib-statistic-card>

    <lib-statistic-card
        title="Approuvées"
        [value]="approved().toLocaleString('fr-FR')"
        valueColor="text-emerald-600"
        [description]="approvedPercentage() + ' du volume total'"
        descriptionColor="text-slate-400">
    </lib-statistic-card>

    <lib-statistic-card
        title="Rejetées"
        [value]="rejected().toLocaleString('fr-FR')"
        valueColor="text-red-600"
        [description]="rejectedPercentage() + ' du volume total'"
        descriptionColor="text-slate-400">
    </lib-statistic-card>
  }
</div>
